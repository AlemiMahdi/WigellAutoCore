spring.application.name=WigellAutoCore
server.port=8080

# Konfiguration för MySQL-databas
spring.datasource.url=jdbc:mysql://localhost:3306/wigell_autocore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=autocore_app
spring.datasource.password=autocore

# Hibernate / JPA konfiguration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


# Säger till Spring att leta efter messages.properties i resource roten
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Om du vill att Spring ska kasta ett fel om en översättning saknas
spring.messages.fallback-to-system-locale=true